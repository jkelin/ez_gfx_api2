[tasks.check]
description = "Check the Rust workspace"
run = "cargo check --workspace"

[tasks.lint]
description = "Run strict Clippy checks and source line limits"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings && cargo run -p xtask -- source-lines"

[tasks.test]
description = "Run the complete workspace test suite"
run = "cargo nextest run --workspace && cargo test --doc --workspace"

[tasks.test-doc]
description = "Run workspace documentation tests (nextest excludes doctests)"
run = "cargo test --doc --workspace"


[tasks.examples-build]
description = "Build all migrated Rust examples"
run = "cargo build -p ez-gfx-examples --bins"


[tasks.examples-smoke]
description = "Run every host-compatible example API smoke"
run = "cargo nextest run -p ez-gfx-examples --test smoke"

[tasks.example-1]
run = "cargo run -p ez-gfx-examples --bin 01_triangle"

[tasks.example-1-vulkan]
description = "Run 01_triangle with Vulkan"
env = { EZ_GFX_BACKEND = "vulkan", VK_LOADER_LAYERS_DISABLE = "~implicit~" }
run = "cargo run -p ez-gfx-examples --bin 01_triangle"

[tasks.example-1-dx12]
description = "Run 01_triangle with DirectX 12"
env = { EZ_GFX_BACKEND = "dx12" }
run = "cargo run -p ez-gfx-examples --bin 01_triangle"

[tasks.example-1-metal]
description = "Run 01_triangle with Metal"
env = { EZ_GFX_BACKEND = "metal" }
run = "cargo run -p ez-gfx-examples --bin 01_triangle"

[tasks.example-1-benchmark]
description = "Benchmark 01_triangle frame throughput on the default backend"
env = { EZ_GFX_BACKEND = "vulkan", EZ_GFX_EXAMPLE_BENCHMARK = "1", EZ_GFX_EXAMPLE_BENCHMARK_WARMUP = "120", EZ_GFX_EXAMPLE_BENCHMARK_FRAMES = "600", VK_LOADER_LAYERS_DISABLE = "~implicit~" }
run = "cargo run -p ez-gfx-examples --release --bin 01_triangle"

[tasks.example-2]
run = "cargo run -p ez-gfx-examples --bin 02_textured_cube"

[tasks.example-3]
run = "cargo run -p ez-gfx-examples --bin 03_compute_structured"

[tasks.example-4]
run = "cargo run -p ez-gfx-examples --bin 04_imgui"

[tasks.example-5]
run = "cargo run -p ez-gfx-examples --bin 05_helmet"

[tasks.example-6]
run = "cargo run -p ez-gfx-examples --bin 06_sponza_ktx2"

[tasks.package]
description = "Build and package runtime/compiler products; append target, version, and output arguments after --"
run = "cargo run -p xtask -- package"
