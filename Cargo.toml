[workspace]
members = [
    "crates/ez-gfx",
    "crates/ez-gfx-core",
    "crates/ez-gfx-hal",
    "crates/ez-gfx-runtime",
    "crates/ez-gfx-basis",
    "crates/ez-gfx-compiler",
    "crates/ez-gfx-artifact",
    "crates/ez-gfx-assets",
    "crates/ez-gfx-ffi",
    "crates/ez-gfx-backend-vulkan",
    "crates/ez-gfx-backend-dx12",
    "crates/ez-gfx-backend-metal",
    "examples",
    "tools/xtask",
    "tools/bindgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
must_use_candidate = "allow"

[workspace.dependencies]
ez-gfx = { path = "crates/ez-gfx" }
ez-gfx-core = { path = "crates/ez-gfx-core" }
ez-gfx-hal = { path = "crates/ez-gfx-hal" }
ez-gfx-runtime = { path = "crates/ez-gfx-runtime" }
ez-gfx-basis = { path = "crates/ez-gfx-basis" }
ez-gfx-artifact = { path = "crates/ez-gfx-artifact" }
ez-gfx-compiler = { path = "crates/ez-gfx-compiler" }
blake3 = { version = "1.8.2", default-features = false, features = ["std", "pure"] }
glam = { version = "0.30.9", features = ["bytemuck"] }
bytemuck = "1.23"
rkyv = { version = "=0.8.18", features = ["bytecheck", "little_endian", "pointer_width_32"] }
anyhow = "1.0.104"
thiserror = "2.0.18"
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.27.0"
static_assertions = "1.1.0"
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"] }
windows = { version = "0.62.2", default-features = false }
libloading = "0.8.9"
objc2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
objc2-core-foundation = { version = "0.3.2", default-features = false }
gpu-allocator = { version = "0.28.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "tga"] }
ktx2 = "0.5.0"
basisu_c_sys = { version = "0.9.0", features = ["extra", "transcode_etc1s_bc3"] }
dispatch2 = "0.3.1"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CAMetalLayer", "CALayer", "objc2-core-foundation", "objc2-metal"] }
crossbeam-channel = "0.5"
rayon = "1.10"
parking_lot = "0.12"
raw-window-handle = "0.6.2"
