[package]
name = "ez-gfx-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autolib = false
autobins = false
autotests = false


[[bin]]
name = "01_triangle"
path = "01_triangle/main.rs"
[[bin]]
name = "02_textured_cube"
path = "02_textured_cube/main.rs"
[[bin]]
name = "03_compute_structured"
path = "03_compute_structured/main.rs"
[[bin]]
name = "04_imgui"
path = "04_imgui/main.rs"
[[bin]]
name = "05_helmet"
path = "05_helmet/main.rs"
[[bin]]
name = "06_sponza_ktx2"
path = "06_sponza_ktx2/main.rs"
[[test]]
name = "smoke"
path = "tests/smoke.rs"


[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
blake3.workspace = true
image.workspace = true
ez-gfx.workspace = true
gltf = { version = "1.4", features = ["import", "extensions", "allow_empty_texture"] }
imgui = "0.12"
raw-window-handle = "0.6"
winit = "0.30"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-quartz-core.workspace = true

[lints]
workspace = true
