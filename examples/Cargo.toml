[package]
name = "ez-gfx-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autolib = false
autobins = false
autotests = false


[[bin]]
name = "01_triangle"
path = "01_triangle/main.rs"
[[bin]]
name = "01_triangle_second_thread"
path = "01_triangle_second_thread/main.rs"
[[bin]]
name = "02_textured_cube"
path = "02_textured_cube/main.rs"
[[bin]]
name = "03_compute_structured"
path = "03_compute_structured/main.rs"
[[bin]]
name = "04_imgui"
path = "04_imgui/main.rs"
[[bin]]
name = "05_helmet"
path = "05_helmet/main.rs"
[[bin]]
name = "06_sponza_ktx2"
path = "06_sponza_ktx2/main.rs"
[[bin]]
name = "allocation_probe"
path = "allocation_probe/main.rs"
[[test]]
name = "smoke"
path = "tests/smoke.rs"
[[test]]
name = "shader_artifacts"
path = "tests/shader_artifacts.rs"


[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
bytemuck = { version = "1.23", features = ["derive"] }
blake3.workspace = true
image.workspace = true
ez-gfx = { workspace = true, features = ["ktx2", "basis"] }
ez-gfx-compiler.workspace = true
gltf = { version = "1.4", features = ["import", "extensions", "allow_empty_texture"] }
glam.workspace = true
imgui = "0.12"
raw-window-handle = "0.6"
thiserror.workspace = true
winit = "0.30"



[dev-dependencies]
ez-gfx-artifact.workspace = true
ez-gfx-core.workspace = true
ez-gfx-runtime.workspace = true
serde_json = "1"
tempfile.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "allow"
pedantic = "allow"
cognitive_complexity = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
allow_attributes_without_reason = "allow"
dbg_macro = "allow"
todo = "allow"
unimplemented = "allow"
undocumented_unsafe_blocks = "allow"
must_use_candidate = "allow"
