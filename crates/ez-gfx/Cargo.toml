[package]
name = "ez-gfx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license.workspace = true
description = "Safe cross-platform GPU API with Vulkan, Direct3D 12, and Metal backends"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
basis = ["ez-gfx-texture-manager/basis"]
ffi = []
ktx2 = ["ez-gfx-texture-manager/ktx2"]

[dependencies]
ez-gfx-core.workspace = true
ez-gfx-hal.workspace = true
ez-gfx-runtime.workspace = true
ez-gfx-artifact.workspace = true
blake3.workspace = true
bytemuck.workspace = true
ez-gfx-geometry-manager.workspace = true
ez-gfx-texture-manager.workspace = true
ez-gfx-backend-vulkan = { path = "../ez-gfx-backend-vulkan", version = "0.1.0" }

raw-window-handle.workspace = true
thiserror.workspace = true
smallvec.workspace = true
arrayvec.workspace = true
compact_str.workspace = true

[dev-dependencies]
static_assertions.workspace = true
[target.'cfg(windows)'.dependencies]
ez-gfx-backend-dx12 = { path = "../ez-gfx-backend-dx12", version = "0.1.0" }

[target.'cfg(target_vendor = "apple")'.dependencies]
ez-gfx-backend-metal = { path = "../ez-gfx-backend-metal", version = "0.1.0" }

[lints]
workspace = true
