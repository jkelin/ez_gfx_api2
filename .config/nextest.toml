nextest-version = "0.9.101"

[profile.default]
fail-fast = false
# Kill each nextest test at its first 60-second slow-timeout boundary.
slow-timeout = { period = "60s", terminate-after = 1 }

# Native backend libraries and higher-level GPU tests share device queues and
# driver state. Keep those tests serial without throttling hardware-neutral
# package tests. Bare `cargo test` is pinned separately via .cargo/config.toml.
[test-groups]
gpu-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(ez-gfx-backend-vulkan)"
test-group = "gpu-serial"

[[profile.default.overrides]]
filter = "package(ez-gfx-backend-dx12)"
test-group = "gpu-serial"

[[profile.default.overrides]]
filter = 'package(ez-gfx) & test(/^state::tests::(adapter_report_names_every_enumerated_adapter|begin_render_target_rejects_foreign_handles|context_decode_worker_count_reaches_pool_construction|creator_thread_exit_returns_and_invalidates_context_handle|destroy_context_before_device_initialization_is_successful_and_terminal|destroy_render_target_clears_bound_override|device_loss_sweeps_pending_decodes_to_fast_device_lost|explicit_selection_creates_context_for_enumerated_adapter|explicit_selection_rejects_unknown_identity_before_native_calls|first_coarse_publication_records_handoff_telemetry_once|frame_begin_clears_stale_render_target_override|heap_slot_exhaustion_is_shared_and_fail_fast|heap_slot_release_reuses_the_freed_binding|heap_slots_unify_textures_and_render_targets_without_collision|probe_render_target_format_rejects_misuse_before_native_work|recursive_context_access_returns_native_failure_without_panicking|rejected_render_target_admissions_leave_no_allocator_residue|render_target_lifecycle_rejects_misuse_before_native_work|texture_admission_is_nonblocking_and_pending_cancellation_invalidates_the_handle|thread_exit_invalidates_populated_context_handle)$/)'
test-group = "gpu-serial"

[[profile.default.overrides]]
filter = 'package(ez-gfx-ffi) & test(/^(abi_uploads::(vulkan|dx12)_|adapter_enumeration_reports_stable_diagnostics|context_lifecycle_rejects_cross_thread_destroy_and_invalidates_destroyed_handle|explicit_adapter_selection_creates_and_rejects_hidden_contexts|(vulkan|dx12)_render_target_lifecycle_queries_probe_and_begin|(vulkan|dx12)_compiles_|(vulkan|dx12|metal).*(pixels|texture_batches))/)'
test-group = "gpu-serial"
