nextest-version = "0.9.101"

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

# Each GPU test creates its own VkDevice/ID3D12Device; >=8 concurrent creations
# wedge the RTX 3080 Windows driver (0 GPU completions). Pin both native backend
# lib suites serial. Bare `cargo test` is pinned separately via
# .cargo/config.toml (libtest has no per-suite knob).
[test-groups]
gpu-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(ez-gfx-backend-vulkan)"
test-group = "gpu-serial"

[[profile.default.overrides]]
filter = "package(ez-gfx-backend-dx12)"
test-group = "gpu-serial"
