name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - name: Install Vulkan build prerequisites
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install --yes libvulkan-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check tracked Rust source sizes
        run: cargo run -p xtask -- source-lines
      - name: Run workspace tests
        run: cargo test --workspace
