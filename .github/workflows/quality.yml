name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VULKAN_SDK_VERSION: 1.4.341.1

jobs:
  policy:
    name: Policy and platform-neutral tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.101
      - name: Install pinned Vulkan SDK with Slang
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check tracked Rust source sizes
        run: cargo run -p xtask -- source-lines
      - name: Run platform-neutral tests
        run: >-
          cargo nextest run
          -p ez-gfx-core
          -p ez-gfx
          -p ez-gfx-hal
          -p ez-gfx-runtime
          -p ez-gfx-artifact
          -p ez-gfx-assets
          -p ez-gfx-compiler
          -p ez-gfx-ffi
          -p xtask
      - name: Run platform-neutral doctests
        run: cargo test --doc --workspace
      - name: Test example logic and source-compiled shader artifacts
        run: |
          cargo nextest run -p ez-gfx-examples --bins
          cargo nextest run -p ez-gfx-examples --test shader_artifacts

  backends:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Vulkan (Lavapipe; native examples compile-only)
            os: ubuntu-24.04
            backend: vulkan-linux
          - name: Windows Vulkan (SwiftShader; compile-only; required descriptor indexing unavailable)
            os: windows-2025
            backend: vulkan-windows
          - name: Windows DX12 (unit tests; native examples compile-only)
            os: windows-2025
            backend: dx12
          - name: macOS Metal (compile-only; hosted runner has no Metal device)
            os: macos-14
            backend: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.101
      - name: Install Linux Vulkan loader, tools, and Lavapipe
        if: matrix.backend == 'vulkan-linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan-dev mesa-vulkan-drivers vulkan-tools
      - name: Install pinned Vulkan SDK with Slang and Windows software Vulkan
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_swiftshader: ${{ matrix.backend == 'vulkan-windows' }}
          cache: true
      - name: Compile ABI v23 header as C11 and C++17
        shell: bash
        run: |
          printf '#include "ez_gfx_api.h"\n_Static_assert(EZ_GFX_ABI_VERSION == 24u, "ABI version"); int main(void) { return 0; }\n' > "$RUNNER_TEMP/ez_gfx_header.c"
          printf '#include "ez_gfx_api.h"\nstatic_assert(EZ_GFX_ABI_VERSION == 24u); int main() { return 0; }\n' > "$RUNNER_TEMP/ez_gfx_header.cpp"
          clang -std=c11 -Werror -fsyntax-only -Iinclude "$RUNNER_TEMP/ez_gfx_header.c"
          clang++ -std=c++17 -Werror -Wno-ignored-attributes -fsyntax-only -Iinclude "$RUNNER_TEMP/ez_gfx_header.cpp"


      # The implementation currently exposes only Win32 Vulkan surfaces, so Linux
      # proves Lavapipe availability but explicitly compiles, rather than faking, runtime coverage.
      # Texture GPU regressions require admitted hardware, unavailable on hosted
      # Lavapipe/SwiftShader. Keep them compiled; execute them on real GPU machines.
      - name: Require Linux Lavapipe capability
        if: matrix.backend == 'vulkan-linux'
        shell: bash
        run: |
          lavapipe_icd=
          while IFS= read -r installed_path; do
            case "$installed_path" in
              */vulkan/icd.d/lvp*.json)
                if [[ -n "$lavapipe_icd" ]]; then
                  printf 'Found multiple Lavapipe ICD manifests: %s and %s\n' \
                    "$lavapipe_icd" "$installed_path" >&2
                  exit 1
                fi
                lavapipe_icd="$installed_path"
                ;;
            esac
          done < <(dpkg-query --listfiles mesa-vulkan-drivers)
          if [[ -z "$lavapipe_icd" || ! -f "$lavapipe_icd" ]]; then
            printf 'Could not locate the installed Lavapipe ICD manifest\n' >&2
            exit 1
          fi
          VK_DRIVER_FILES="$lavapipe_icd" vulkaninfo --summary
      - name: Test Linux Vulkan device-independent contracts; compile native GPU suites
        if: matrix.backend == 'vulkan-linux'
        run: |
          cargo nextest run -p ez-gfx-backend-vulkan --lib -E 'not test(texture::texture_tests::)'
          cargo nextest run -p ez-gfx-backend-vulkan --lib -E 'test(texture::texture_tests::)' --no-run
          cargo nextest run -p ez-gfx-backend-vulkan --test native_init --no-run
          cargo nextest run -p ez-gfx-examples --test smoke --no-run
          cargo build -p ez-gfx-backend-vulkan

      - name: Expose Windows Vulkan tools
        if: matrix.backend == 'vulkan-windows'
        shell: pwsh
        run: |
          $vulkanTools = Join-Path $env:VULKAN_SDK 'Bin'
          $vulkanInfo = Join-Path $vulkanTools 'vulkaninfoSDK.exe'
          if (-not (Test-Path -LiteralPath $vulkanInfo -PathType Leaf)) {
            throw "Vulkan SDK tools are missing: $vulkanInfo"
          }
          $vulkanTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require Windows software Vulkan capability
        if: matrix.backend == 'vulkan-windows'
        env:
          VK_DRIVER_FILES: C:\swiftshader\vk_swiftshader_icd.json
        run: vulkaninfoSDK.exe --summary
      - name: Test Windows Vulkan device-independent library contracts
        if: matrix.backend == 'vulkan-windows'
        timeout-minutes: 20
        run: |
          cargo nextest run -p ez-gfx-backend-vulkan --lib -E 'not test(texture::texture_tests::)'
          cargo nextest run -p ez-gfx-backend-vulkan --lib -E 'test(texture::texture_tests::)' --no-run
      - name: Test Windows Vulkan ez-gfx library contracts
        if: matrix.backend == 'vulkan-windows'
        timeout-minutes: 20
        run: cargo nextest run -p ez-gfx --lib
      - name: Compile Windows Vulkan native init test suite
        if: matrix.backend == 'vulkan-windows'
        timeout-minutes: 20
        run: cargo nextest run -p ez-gfx-backend-vulkan --test native_init --no-run
      - name: Compile Windows Vulkan ez-gfx test suites
        if: matrix.backend == 'vulkan-windows'
        timeout-minutes: 20
        run: cargo nextest run -p ez-gfx --no-run
      - name: Compile Windows Vulkan ez-gfx-ffi test suites
        if: matrix.backend == 'vulkan-windows'
        timeout-minutes: 20
        run: cargo nextest run -p ez-gfx-ffi --no-run
      - name: Compile Windows Vulkan ez-gfx-examples test suites
        if: matrix.backend == 'vulkan-windows'
        timeout-minutes: 20
        run: cargo nextest run -p ez-gfx-examples --no-run
      - name: Build Windows Vulkan backend
        if: matrix.backend == 'vulkan-windows'
        timeout-minutes: 20
        run: cargo build -p ez-gfx-backend-vulkan

      # GitHub-hosted Windows runners do not guarantee a D3D12 feature-level 12.1
      # adapter. Backend unit tests execute; native GPU and example suites compile only.
      - name: Test DX12 units and boundary; compile unsupported native runtime suites
        if: matrix.backend == 'dx12'
        run: |
          cargo nextest run -p ez-gfx-backend-dx12 --lib
          cargo nextest run -p ez-gfx-backend-dx12 --test native_init -E 'test(=rejects_a_null_hwnd_before_swapchain_creation)'
          cargo nextest run -p ez-gfx-backend-dx12 --test native_init --no-run
          cargo nextest run -p ez-gfx-examples --test smoke --no-run
          cargo nextest run -p ez-gfx-ffi --test pso_smoke --no-run
          cargo build -p ez-gfx-backend-dx12

      # GitHub-hosted macOS runners expose the Apple toolchain but no Metal device.
      # Run device-independent contracts and compile every Apple-native surface.
      - name: Test device-independent Metal contracts
        if: matrix.backend == 'metal'
        run: |
          cargo nextest run -p ez-gfx-core -p ez-gfx-hal -p ez-gfx-runtime
          cargo nextest run -p ez-gfx-artifact -p ez-gfx-compiler
      - name: Compile Metal runtime surfaces without a device
        if: matrix.backend == 'metal'
        run: |
          cargo nextest run -p ez-gfx-backend-metal --no-run
          cargo nextest run -p ez-gfx --no-run
          cargo nextest run -p ez-gfx-ffi --no-run
          cargo nextest run -p ez-gfx-examples --no-run
          cargo nextest run -p ez-gfx-ffi --test metal_present --no-run

      - name: Build FFI
        run: cargo build -p ez-gfx-ffi
      - name: Build and link C textured cube
        if: runner.os == 'Windows'
        run: |
          cargo build -p ez-gfx-compiler --bin ez-gfx-compile
          cmake -S examples/c/textured_cube -B target/c-examples/textured_cube-build
          cmake --build target/c-examples/textured_cube-build --config Debug
